plugins {
    id 'java'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

group 'org.example'
version '1.0-SNAPSHOT'

repositories {
    maven {
        name = "Central Portal Snapshots"
        url = uri("https://central.sonatype.com/repository/maven-snapshots/")
        content {
            includeModule("info.openrocket", "core")
        }
    }
    mavenCentral()
}

dependencies {
    implementation("info.openrocket:core:24.12")
    implementation 'com.fazecast:jSerialComm:[2.0.0,)'

    implementation 'org.junit.jupiter:junit-jupiter:6.0.0'
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test) {
    useJUnitPlatform()

    // cmakeBuild builds both the JNI library and the firmware SITL library
    // (libflight-firmware-sitl.so) into the same directory; the JNI bridge
    // dlmopen's the firmware as a sibling at runtime.
    dependsOn tasks.cmakeBuild
    workingDir = projectDir
    systemProperty "java.library.path", file("cmake-build/Release").absolutePath

    // Forward -Dairbrakes.mode (default FULL_SITL) to the test JVM so the mode
    // can be switched, e.g. ./gradlew test -Dairbrakes.mode=CLOSED_LOOP_SIM.
    systemProperty "airbrakes.mode", System.getProperty("airbrakes.mode", "FULL_SITL")

    // Each FULL_SITL simulation dlmopen()s the firmware into a fresh namespace.
    // glibc caps a process at DL_NNS (~15) such namespaces and never reclaims a
    // slot on dlclose, and it also draws each namespace's libc initial-exec TLS
    // from a fixed static-TLS surplus that dlclose likewise won't return. Both
    // are process-lifetime limits independent of our (clean) firmware teardown.
    //
    // forkEvery = 1 gives every test class its own JVM, so each class's handful
    // of simulations starts from a fresh namespace/TLS budget — the split into
    // AirbrakesNominalTest / AirbrakesFaultTest keeps each well under the caps.
    // The enlarged static-TLS surplus is extra headroom should a class grow.
    forkEvery = 1
    environment "GLIBC_TUNABLES", "glibc.rtld.optional_static_tls=524288"

    maxHeapSize = '1G'

    testLogging {
        events "passed", "failed", "skipped"
        showStandardStreams = true
    }
}

tasks.register('run', JavaExec) {
    dependsOn jar

    mainClass = 'info.openrocket.swing.startup.OpenRocket'
    classpath = files('OpenRocket-24.12.jar') + sourceSets.main.runtimeClasspath

    workingDir = projectDir
    systemProperty "java.library.path", file("cmake-build/Release").absolutePath

    args = ['IREC 4.22.26.ork']
}

tasks.withType(JavaCompile) {
    options.compilerArgs += ["-h", file("src/main/jni/headers")]
}

tasks.register('cmakeConfigure', Exec) {
    // 1. Generate the build configuration files
    commandLine 'cmake', '-Bcmake-build', '-S.', '-GNinja', '-DCMAKE_BUILD_TYPE=Release'
}

tasks.register('cmakeBuild', Exec) {
    // 2. Execute the actual compilation
    dependsOn cmakeConfigure
    commandLine 'cmake', '--build', 'cmake-build'
}

tasks.named('jar') {
    dependsOn(tasks.cmakeBuild)
} 