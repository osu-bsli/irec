plugins {
    id 'java'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

group 'org.example'
version '1.0-SNAPSHOT'

repositories {
    maven {
        name = "Central Portal Snapshots"
        url = uri("https://central.sonatype.com/repository/maven-snapshots/")
        content {
            includeModule("info.openrocket", "core")
        }
    }
    mavenCentral()
}

dependencies {
    implementation("info.openrocket:core:24.12")
    implementation 'com.fazecast:jSerialComm:[2.0.0,)'

    implementation 'org.junit.jupiter:junit-jupiter:6.0.0'
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// ---- Firmware SITL library (full flight firmware as a deterministic .so) ----
// Built from the separate flight-software-pc CMake project; the JUnit tests
// dlmopen it via the JNI bridge to run the real firmware in the loop.
def firmwarePcDir = file("../flight-software-pc")
def firmwareBuildDir = file("../flight-software-pc/build")
def firmwareSitlLib = file("../flight-software-pc/build/libflight-firmware-sitl.so")

tasks.register('firmwareSitlConfigure', Exec) {
    commandLine 'cmake', '-S', firmwarePcDir.absolutePath,
                '-B', firmwareBuildDir.absolutePath,
                '-GNinja', '-DCMAKE_BUILD_TYPE=Release'
}

tasks.register('firmwareSitlBuild', Exec) {
    dependsOn 'firmwareSitlConfigure'
    commandLine 'cmake', '--build', firmwareBuildDir.absolutePath,
                '--target', 'flight-firmware-sitl'
}

tasks.named('test', Test) {
    useJUnitPlatform()

    dependsOn tasks.cmakeBuild, tasks.firmwareSitlBuild
    workingDir = projectDir
    systemProperty "java.library.path", file("cmake-build/Release").absolutePath

    // FULL_SITL: where to dlmopen the firmware, and a runtime dir for its
    // emulated-radio Unix socket (needs a trailing slash).
    environment "FW_SITL_LIB", firmwareSitlLib.absolutePath
    environment "XDG_RUNTIME_DIR", "/tmp/"

    // Forward -Dairbrakes.mode (default FULL_SITL) to the test JVM so the mode
    // can be switched, e.g. ./gradlew test -Dairbrakes.mode=CLOSED_LOOP_SIM.
    systemProperty "airbrakes.mode", System.getProperty("airbrakes.mode", "FULL_SITL")

    maxHeapSize = '1G'

    testLogging {
        events "passed", "failed", "skipped"
        showStandardStreams = true
    }
}

tasks.register('run', JavaExec) {
    dependsOn jar

    mainClass = 'info.openrocket.swing.startup.OpenRocket'
    classpath = files('OpenRocket-24.12.jar') + sourceSets.main.runtimeClasspath

    workingDir = projectDir
    systemProperty "java.library.path", file("cmake-build/Release").absolutePath

    args = ['IREC 4.22.26.ork']
}

tasks.withType(JavaCompile) {
    options.compilerArgs += ["-h", file("src/main/jni/headers")]
}

tasks.register('cmakeConfigure', Exec) {
    // 1. Generate the build configuration files
    commandLine 'cmake', '-Bcmake-build', '-S.', '-GNinja', '-DCMAKE_BUILD_TYPE=Release'
}

tasks.register('cmakeBuild', Exec) {
    // 2. Execute the actual compilation
    dependsOn cmakeConfigure
    commandLine 'cmake', '--build', 'cmake-build'
}

tasks.named('jar') {
    dependsOn(tasks.cmakeBuild)
} 