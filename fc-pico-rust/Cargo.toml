[package]
name = "embassy-practice"
version = "0.1.0"
edition = "2024"

[features]
default = ["rp235xa"]
rp235xa = ["embassy-rp/rp235xa"]

[dependencies]
# embassy-embedded-hal = { version = "0.6.0", features = ["defmt"] }
# embassy-sync = { version = "0.8.0", features = ["defmt"] }
embassy-executor = { version = "0.10.0", features = ["defmt"] }
embassy-time = { version = "0.5.1", features = ["defmt", "defmt-timestamp-uptime"] }
embassy-rp = { version = "0.10.0", features = ["defmt", "unstable-pac", "time-driver", "critical-section-impl", "binary-info", "executor-thread", "executor-interrupt"] }
# embassy-usb = { version = "0.6.0", features = ["defmt"] }
# embassy-usb-driver = { version = "0.2.2" }
# embassy-net = { version = "0.9.1", features = ["defmt", "tcp", "tcp-listener", "udp", "raw-ethernet", "raw-ip", "dhcpv4", "medium-ethernet", "dns", "icmp-ping-reply"] }
# embassy-net-wiznet = { version = "0.3.0", features = ["defmt"] }
# embassy-futures = { version = "0.1.2" }
# embassy-usb-logger = { version = "0.6.0" }

defmt = "1.0.1"
defmt-rtt = "1.0.0"
cortex-m = { version = "0.7.6", features = ["inline-asm"] }
cortex-m-rt = "0.7.0"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }

[patch.crates-io]
embassy-time = { git = "https://github.com/embassy-rs/embassy", rev = "14cf6a68ec0bfd0ecf873f7e3dbb2eb69013fa29" }
embassy-executor = { git = "https://github.com/embassy-rs/embassy", rev = "14cf6a68ec0bfd0ecf873f7e3dbb2eb69013fa29" }
embassy-rp = { git = "https://github.com/embassy-rs/embassy", rev = "14cf6a68ec0bfd0ecf873f7e3dbb2eb69013fa29" }

[package.metadata.embassy]
build = [
  { target = "thumbv8m.main-none-eabihf", artifact-dir = "out/" }
]

[profile.release]
debug = 2